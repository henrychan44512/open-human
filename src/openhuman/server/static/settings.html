<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>html { background: #0a0c0f; }</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0c0f'/%3E%3Ccircle cx='16' cy='16' r='4.5' fill='%23d9b487'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/s/style.css">
</head>
<body>
<div class="aura"></div>
<div class="glow"></div>
<div class="vignette"></div>
<div class="screen">
  <div class="column">
    <div class="brand">settings</div>
    <div class="form">
      <div class="row">
        <label>模型后端</label>
        <select id="backend">
          <option value="llama">本地 llama-server</option>
          <option value="deepseek">DeepSeek API</option>
        </select>
      </div>
      <div class="row">
        <label>服务地址</label>
        <input id="base_url" type="text" spellcheck="false">
      </div>
      <div class="row">
        <label>temperature</label>
        <input id="temperature" type="number" step="0.05" min="0" max="2">
      </div>
      <div class="row">
        <label>top_p</label>
        <input id="top_p" type="number" step="0.05" min="0" max="1">
      </div>
      <div class="row">
        <label>单次上限</label>
        <input id="max_reply_tokens" type="number" step="50" min="50" max="2000">
      </div>
      <div class="row">
        <label>工具</label>
        <select id="tools">
          <option value="off">关掉，只说话</option>
          <option value="read">他能看文件</option>
          <option value="write">他能写文件、跑命令</option>
        </select>
      </div>
      <div class="note">工具只能碰这个人格包里的 workspace/。这段对话里是否开着，看这里。</div>
      <div class="note" id="note"></div>
      <div class="note"><span class="saved" id="saved">已保存</span></div>
    </div>
    <div class="foot">
      <a href="/">← 返回</a>
      <span id="status">…</span>
      <span class="ver" id="ver"></span>
    </div>
  </div>
</div>
<script src="/s/core.js"></script>
<script src="/s/settings.js"></script>
</body>
</html>
